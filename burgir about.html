<style>
  body {
    /*  STYLE FOR Burgir ABOUT US page */
    font-family: 'Arial', sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
  }

  header {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 20px 0;
  }

  .team-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    padding: 20px;
    background-color: #ffffff;
   

  }
 

  .team-member {
    text-align: center;
    background-color: #fff;
    padding: 20px;
    border-radius: 89px;
    box-shadow: 10px 0 0 10px rgba(0, 0, 0, 0.1);
    max-width: 300px;
    width: 30%;
    margin: 10px;
  }

  

  .member-avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background-color: #333;
    margin: 0 auto 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    color: #fff;
  }

  .team-member h3 {
    color: #333;
  }

  .team-member p {
    color: #666;
  }

  button {
    /* Style for the "BACK" button */
    border: none;
    padding: 0;
    margin: 0;
    background: none;
    cursor: pointer;
  }


  button a {
    text-decoration: none;
    display: inline-block;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    color: #f8f8f5;
    background-color: #076740;
    border-radius: 5px;
    transition: background-color 0.3s, color 0.3s;
  }

  button a:hover {
    background-color: #fc30de;
    color: #0b1103;
  }

  .abc {
    background-color: #ffffff;
    margin: 0 0;
    padding: 20px 0;

  }

  /*  Style END */
</style>
