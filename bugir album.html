<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Food Album</title>

  <style>









    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      text-align: center;
      background-color: #333;
      color: #fff;
      padding: 10px;
    }

    #album {
      display: flex;
      justify-content: space-around;
      padding: 20px;
    }

    .food-item {
      width: 50%; /* Adjust the width as needed */
      margin: 10px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }

    .food-item:hover {
      transform: scale(1.05);
    }

    .food-item img {
      width: 100%;
      height: 350px;
      border-radius: 10px 10px 0 0;
    }

    .food-item p {
      text-align: center;
      padding: 10px;
      margin: 0;
      background-color: #333;
      color: #fff;
      border-radius: 0 0 10px 10px;
    }

    button {
    /* Style for the "BACK" button */
    border: none;
    padding: 0;
    margin: 0;
    background: none;
    cursor: pointer;
}


button a {
    text-decoration: none;
    display: inline-block;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    color: #f8f8f5;
    background-color: #076740;
    border-radius: 5px;
    transition: background-color 0.3s, color 0.3s;
}

button a:hover {
    background-color: #fc30de;
    color: #0b1103;
}


  </style>
</head>
<body>

  </header>
