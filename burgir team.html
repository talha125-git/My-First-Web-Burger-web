<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUR TEAM</title>
    <link rel="icon" href="burgir favicon.ico">
</head>

<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #333;
        color: #fff;
        text-align: center;
        padding: 20px 0;
    }

    .team-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding: 0px;
    }

    .team-member {
        margin: 20px;
        text-align: center;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 89px;
        box-shadow: 10px 0 10px rgba(0, 0, 0, 0.2);
        max-width: 300px;
        width: 100%;
        
        transition: transform 0.2s ease-in-out;
    }

    .team-member:hover {
        transform: scale(1.07);
    }

    .team-member img {
        border-radius: 50%;
        height: 250px;
        width: 250px;
        object-fit: cover;
        border: 4px solid #fff;
    }

    .team-member h3 {
        margin-top: 10px;
        color: #020101;
        font-size: 1.5em;
    }

    .team-member p {
        color: #0a0242;
        font-size: 1.2em;
        margin-top: 8px;
    }

    button {
    /* Style for the "BACK" button */
    border: none;
    padding: 0;
    margin: 0;
    background: none;
    cursor: pointer;
}


button a {
    text-decoration: none;
    display: inline-block;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    color: #f8f8f5;
    background-color: #076740;
    border-radius: 5px;
    transition: background-color 0.3s, color 0.3s;
}

button a:hover {
    background-color: #fc30de;
    color: #0b1103;
}



</style>

<body>

    <header>
        <h1>Meet Our Amazing Team</h1>
    </header>

    <div class="team-container">
        <div class="team-member">
            <img src="./burgir images/me3.jpg" alt="Team Leader">
            <h3>ABUTALHA</h3>
            <p><b>Director & Managing Computer</b></p>
        </div>

        <div class="team-member">
            <img src="./burgir images/hadi1.jpg" alt="Team Member 2">
            <h3>HADII</h3>
            <p><b>A Chief Cook</b></p>
        </div>

        <div class="team-member">
            <img src="./burgir images/khyzar.jpg" alt="Team Member 3">
            <h3>Muhammad Khyar</h3>
            <p><b>Counter Manager</b></p>
        </div>

        <!-- Add more team members as needed -->

    </div>
    <button><a href="burgir.html">Back</a></button>

</body>

</html>
