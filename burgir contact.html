<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us </title>
    <link rel="icon" href="burgir favicon.ico">
</head>

<style>
    body {
        /* CONTACT US STYLE PAGE*/
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        background-image: url(./burgir\ images/phone);
        background-size: 40%;
        background-position: right;
       
        display: flex;
        background-repeat: no-repeat;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    .contact-container {
        background-color: rgba(245, 244, 244, 0.8);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 10px 0 0 10px rgba(0, 0, 0, 0.2);
        width: 300px;
        text-align: center;
        position: absolute;
        left: 20%;
        /* Adjust the percentage to move it to the left */
    }

    .contact-header {
        background-color: #543b92;
        color: #fff;
        padding: 15px;
        font-size: 1.5em;
    }

    .contact-header:hover {
        color: rgb(6, 8, 8);
    }

    .contact-info {
        padding: 15px;
    }

    .phone-number {
        font-size: 1.2em;
        color: #333;
        margin-top: 10px;
    }

    button {
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;


        position: absolute;
        bottom: 10px;
        left: 5%;
        transform: translateX(-40%);
    }

    button a {
        color: rgb(255, 255, 255);
        text-decoration: none;
        display: inline-block;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;
        transition: background-color 0.3s, color 0.3s;
        background-color: #0d6e3f;

    }

    button a:hover {
        background-color: #fc30de;
        color: #0b1103;
    }

    /* CONTACT US STYLE END*/
</style>



<body>


    <div class="contact-container">
        <div class="contact-header">
            <h2>Contact Us</h2>
        </div>

        <div class="contact-info">
            <p class="phone-number">Phone: +92 347 67 22 423</p>
        </div>
    </div>
    <button><a href="burgir.html">BACK</a></button>

</body>

</html>
